<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fernandes Maps</title>
  <meta name="description" content="Baixe o Fernandes Maps para Android ou Windows.">
  <style>
    :root {
      --bg-1: #0b1220;
      --bg-2: #111827;
      --card: rgba(17, 24, 39, 0.88);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --orange: #ff7a18;
      --orange-dark: #e85d04;
      --border: rgba(255, 255, 255, 0.10);
      --disabled: #64748b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, rgba(255, 122, 24, 0.16), transparent 32%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: min(100%, 520px);
      padding: 38px 28px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--card);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
      text-align: center;
    }

    .app-icon {
      width: 132px;
      height: 132px;
      object-fit: cover;
      border-radius: 28px;
      border: 1px solid var(--border);
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.35);
      background: #1f2937;
    }

    h1 {
      margin: 22px 0 10px;
      font-size: clamp(2rem, 7vw, 3rem);
      line-height: 1.05;
    }

    .subtitle {
      margin: 0 auto 30px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
    }

    .buttons {
      display: grid;
      gap: 14px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 15px 18px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      transition: transform .15s ease, filter .15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    .btn-android {
      color: #fff;
      background: linear-gradient(135deg, var(--orange), var(--orange-dark));
      cursor: not-allowed;
      opacity: .72;
    }

    .btn-windows {
      color: #fff;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
    }

    .note {
      margin-top: 18px;
      font-size: .86rem;
      color: #94a3b8;
    }

    @media (max-width: 520px) {
      .card {
        padding: 30px 20px;
        border-radius: 20px;
      }

      .app-icon {
        width: 112px;
        height: 112px;
        border-radius: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <img
      class="app-icon"
      src="icone.png"
      alt="Ícone do Fernandes Maps"
      onerror="this.onerror=null; this.src='icone.jpeg';"
    >

    <h1>Fernandes Maps</h1>

    <p class="subtitle">
      Aplicativo para consulta de mapas, focos, vento e informações de apoio à operação em campo.
    </p>

    <div class="buttons">
      <!-- Configure posteriormente o link do Android substituindo # pelo arquivo ou URL desejado. -->
      <a class="btn btn-android" href="#" onclick="return false;" aria-disabled="true">
        Download para Android
      </a>

      <a class="btn btn-windows" href="FernandesMaps.exe" download>
        Download para Windows
      </a>
    </div>

    <p class="note">
      A versão Android será disponibilizada posteriormente.
    </p>
  </main>
</body>
</html>
